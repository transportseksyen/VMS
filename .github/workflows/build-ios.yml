name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned iOS app
        run: |
          xcodebuild -project ios/SarawakFMS.xcodeproj \
            -scheme SarawakFMS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned app
        run: |
          APP_PATH="$(find build/ios -type d -name 'SarawakFMS.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "SarawakFMS.app was not found under build/ios"
            find build/ios -maxdepth 7 -type d -name '*.app' -print || true
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" SarawakFMS-iOS-unsigned.zip

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarawak-fms-ios-unsigned
          path: SarawakFMS-iOS-unsigned.zip
