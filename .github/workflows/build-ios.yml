name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned iOS app
        run: |
          xcodebuild -project ios/SarawakFMS.xcodeproj \
            -scheme SarawakFMS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned app
        run: |
          cd build/ios/Build/Products/Release-iphoneos
          zip -r ../../../../../SarawakFMS-iOS-unsigned.zip SarawakFMS.app

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarawak-fms-ios-unsigned
          path: SarawakFMS-iOS-unsigned.zip
